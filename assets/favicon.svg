<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <mask id="o-mask">
      <rect width="100" height="100" fill="white"/>
      <rect x="33" y="33" width="34" height="34" rx="11" fill="black"/>
    </mask>
  </defs>
  <!-- Sky blue background -->
  <rect width="100" height="100" rx="20" fill="#4baaff"/>
  <!-- Ink shadow of O glyph (offset 4px down-right) -->
  <rect x="22" y="22" width="64" height="64" rx="18" fill="#111111" mask="url(#o-mask)"/>
  <!-- Pink O glyph -->
  <rect x="18" y="18" width="64" height="64" rx="18" fill="#fd64b3" mask="url(#o-mask)"/>
</svg>
