<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="900" fill="#FFFFFF"/>
  <circle cx="1180" cy="160" r="160" fill="#D9B3FF" opacity="0.28"/>
  <text x="96" y="110" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="62" font-weight="700">Onobumba Typography</text>
  <text x="96" y="154" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="24">Display with warmth and character. Body copy with clarity and restraint.</text>

  <g transform="translate(96 240)">
    <text x="0" y="0" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="30" font-weight="700">Display: Bricolage Grotesque</text>
    <text x="0" y="76" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="72" font-weight="700">Imagine. Build. Play.</text>
    <text x="0" y="136" fill="#E6197E" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="34" font-weight="600">Bold, expressive, slightly handmade without losing electric precision.</text>
    <text x="0" y="200" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="24" font-weight="500">ABCDEFGHIJKLMNOPQRSTUVWXYZ</text>
    <text x="0" y="236" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="24" font-weight="500">abcdefghijklmnopqrstuvwxyz 0123456789</text>
  </g>

  <g transform="translate(96 520)">
    <text x="0" y="0" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="30" font-weight="700">Body: Instrument Sans</text>
    <text x="0" y="64" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="30" font-weight="500">Onobumba makes digital products that feel</text>
    <text x="0" y="104" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="30" font-weight="500">useful, open, and carefully made.</text>
    <text x="0" y="156" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="24">Use for product descriptions, interface copy, and editorial writing.</text>
    <text x="0" y="228" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20" font-weight="600">Suggested hierarchy</text>
    <text x="0" y="268" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">H1 64/72 Bricolage Grotesque Bold</text>
    <text x="0" y="300" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">H2 40/48 Bricolage Grotesque Semibold</text>
    <text x="0" y="332" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">Body 18/30 Instrument Sans Regular</text>
    <text x="0" y="364" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">Meta 14/22 Instrument Sans Medium</text>
  </g>

  <g transform="translate(1020 502)">
    <rect width="244" height="220" rx="32" fill="#7B2FBE"/>
    <text x="34" y="72" fill="#FFFFFF" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18" font-weight="600">Tone cues</text>
    <text x="34" y="112" fill="#FFFFFF" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="16">maker-led</text>
    <text x="34" y="142" fill="#FFFFFF" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="16">crafted</text>
    <text x="34" y="172" fill="#FFFFFF" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="16">curious</text>
    <text x="34" y="202" fill="#FFFFFF" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="16">clear</text>
  </g>
</svg>