<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="180" y1="120" x2="1420" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0E6FF"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.92"/>
    </linearGradient>
    <mask id="concept-violet-interlock">
      <rect width="280" height="280" fill="black"/>
      <rect x="40" y="40" width="168" height="168" rx="50" fill="white"/>
      <rect x="104" y="104" width="60" height="60" rx="20" fill="black"/>
      <rect x="150" y="132" width="92" height="108" rx="36" fill="black"/>
    </mask>
    <mask id="concept-lime-interlock">
      <rect width="280" height="280" fill="black"/>
      <rect x="112" y="112" width="128" height="128" rx="40" fill="white"/>
      <rect x="142" y="142" width="50" height="50" rx="16" fill="black"/>
      <rect x="90" y="90" width="72" height="72" rx="24" fill="black"/>
    </mask>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1340" cy="150" r="170" fill="#D9B3FF" opacity="0.32"/>
  <circle cx="190" cy="760" r="230" fill="#C499FF" opacity="0.26"/>
  <circle cx="1210" cy="760" r="180" fill="#E8FF8A" opacity="0.2"/>

  <text x="120" y="124" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="68" font-weight="700">Onobumba Logo Routes</text>
  <text x="120" y="174" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="24">Three non-letter directions for a maker-led studio brand anchored in fit, relation, and assembly.</text>

  <rect x="120" y="250" width="420" height="500" rx="36" fill="url(#cardGlow)"/>
  <rect x="590" y="250" width="420" height="500" rx="36" fill="url(#cardGlow)"/>
  <rect x="1060" y="250" width="420" height="500" rx="36" fill="url(#cardGlow)"/>

  <g transform="translate(182 304)">
    <rect width="280" height="280" fill="#7B2FBE" mask="url(#concept-violet-interlock)"/>
    <rect width="280" height="280" fill="#C6F221" mask="url(#concept-lime-interlock)"/>
  </g>
  <text x="170" y="628" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="34" font-weight="700">Offset Interlock</text>
  <text x="170" y="668" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20">Two fitted forms share the same center</text>
  <text x="170" y="698" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20">without collapsing into one blob.</text>
  <text x="170" y="732" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">Recommended: distinct, compact,</text>
  <text x="170" y="758" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">strong at favicon scale.</text>

  <g transform="translate(646 306)">
    <rect x="18" y="28" width="244" height="244" rx="74" fill="#7B2FBE"/>
    <path d="M189 52L236 99L148 187H92C74 187 60 173 60 155V99C60 81 74 67 92 67H148L189 52Z" fill="#FFFFFF"/>
    <path d="M190 76L215 101L140 176H100C90 176 82 168 82 158V118C82 108 90 100 100 100H148L190 76Z" fill="#C6F221"/>
  </g>
  <text x="640" y="628" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="34" font-weight="700">Keyway Join</text>
  <text x="640" y="668" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20">A structural body receives a fitted insert</text>
  <text x="640" y="698" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20">through one directional opening.</text>
  <text x="640" y="732" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">Sharper and more engineered than</text>
  <text x="640" y="758" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">the recommended route.</text>

  <g transform="translate(1116 304)">
    <path d="M36 62C36 40 54 22 76 22H152C170 22 184 36 184 54V98L146 136L184 174V226C184 244 170 258 152 258H76C54 258 36 240 36 218V62Z" fill="#7B2FBE"/>
    <path d="M244 62C244 40 226 22 204 22H128C110 22 96 36 96 54V98L134 136L96 174V226C96 244 110 258 128 258H204C226 258 244 240 244 218V62Z" fill="#C6F221"/>
    <path d="M146 136L184 98V174L146 136Z" fill="#FFFFFF"/>
    <path d="M134 136L96 98V174L134 136Z" fill="#FFFFFF"/>
  </g>
  <text x="1110" y="628" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="34" font-weight="700">Dovetail Join</text>
  <text x="1110" y="668" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20">Two weighted parts meet through a</text>
  <text x="1110" y="698" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20">tapered seam closer to woodworking logic.</text>
  <text x="1110" y="732" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">Warmest route, but more referential</text>
  <text x="1110" y="758" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">than the others.</text>

  <rect x="120" y="790" width="1360" height="2" fill="#C4A8E0"/>
  <text x="120" y="830" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="24" font-weight="600">Recommended route</text>
  <text x="120" y="866" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="24">Offset Interlock best balances distinction, warmth, silhouette clarity, and a strong fitted-parts metaphor.</text>
</svg>