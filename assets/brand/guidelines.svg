<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="guide-violet-interlock">
      <rect width="220" height="220" fill="black"/>
      <rect x="32" y="32" width="132" height="132" rx="40" fill="white"/>
      <rect x="82" y="82" width="48" height="48" rx="16" fill="black"/>
      <rect x="118" y="104" width="72" height="84" rx="28" fill="black"/>
    </mask>
    <mask id="guide-lime-interlock">
      <rect width="220" height="220" fill="black"/>
      <rect x="88" y="88" width="100" height="100" rx="32" fill="white"/>
      <rect x="112" y="112" width="40" height="40" rx="14" fill="black"/>
      <rect x="70" y="70" width="56" height="56" rx="18" fill="black"/>
    </mask>
    <g id="guide-symbol">
      <rect width="220" height="220" fill="#7B2FBE" mask="url(#guide-violet-interlock)"/>
      <rect width="220" height="220" fill="#C6F221" mask="url(#guide-lime-interlock)"/>
    </g>
  </defs>
  <rect width="1600" height="1200" fill="#FFFFFF"/>
  <text x="90" y="110" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="64" font-weight="700">Onobumba Brand Guidelines</text>
  <text x="90" y="154" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="24">A compact reference for using the new interlock mark, color roles, and maker-led voice consistently.</text>

  <g transform="translate(90 240)">
    <text x="0" y="0" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="32" font-weight="700">1. Primary mark</text>
    <rect x="0" y="32" width="640" height="280" rx="32" fill="#FFFFFF" stroke="#C4A8E0" stroke-width="3"/>
    <g transform="translate(52 74)">
      <use href="#guide-symbol"/>
    </g>
    <text x="298" y="160" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="56" font-weight="700" letter-spacing="-2">onobumba</text>
    <text x="298" y="208" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20" font-weight="600">Imagine. Build. Play.</text>
    <text x="298" y="244" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="17">The mark shows two parts fitting together</text>
    <text x="298" y="268" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="17">into a stable whole without slipping into</text>
    <text x="298" y="290" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="17">generic tech geometry.</text>
  </g>

  <g transform="translate(870 240)">
    <text x="0" y="0" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="32" font-weight="700">2. Clear space and minimum size</text>
    <rect x="0" y="32" width="640" height="280" rx="32" fill="#FFFFFF" stroke="#C4A8E0" stroke-width="3"/>
    <rect x="74" y="86" width="214" height="214" rx="28" fill="none" stroke="#C6F221" stroke-dasharray="10 10" stroke-width="4"/>
    <g transform="translate(76 88)">
      <use href="#guide-symbol"/>
    </g>
    <text x="346" y="132" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="22" font-weight="700">Clear space</text>
    <text x="346" y="162" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">Leave at least the width of the inner seam</text>
    <text x="346" y="186" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">around the mark so the fit remains readable.</text>
    <text x="346" y="224" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="22" font-weight="700">Minimum sizes</text>
    <text x="346" y="262" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20">Symbol: 20px high</text>
    <text x="346" y="292" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20">Full lockup: 140px wide</text>
  </g>

  <g transform="translate(90 640)">
    <text x="0" y="0" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="32" font-weight="700">3. Palette roles</text>
    <rect x="0" y="32" width="640" height="320" rx="32" fill="#FFFFFF" stroke="#C4A8E0" stroke-width="3"/>
    <rect x="48" y="86" width="120" height="120" rx="22" fill="#7B2FBE"/>
    <rect x="192" y="86" width="120" height="120" rx="22" fill="#C6F221"/>
    <rect x="336" y="86" width="120" height="120" rx="22" fill="#E6197E"/>
    <rect x="480" y="86" width="120" height="120" rx="22" fill="#FF6B2B"/>
    <text x="48" y="244" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">Violet</text>
    <text x="48" y="272" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="15">Structure / frame</text>
    <text x="192" y="244" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">Lime</text>
    <text x="192" y="272" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="15">Fitted part / energy</text>
    <text x="336" y="244" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">Magenta</text>
    <text x="336" y="270" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="14">Support accent</text>
    <text x="336" y="290" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="14">only</text>
    <text x="480" y="244" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">Orange</text>
    <text x="480" y="270" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="13">Use sparingly.</text>
    <text x="480" y="288" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="13">Never as a detached node.</text>
  </g>

  <g transform="translate(870 640)">
    <text x="0" y="0" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="32" font-weight="700">4. Voice and type</text>
    <rect x="0" y="32" width="640" height="320" rx="32" fill="#FFFFFF" stroke="#C4A8E0" stroke-width="3"/>
    <text x="44" y="110" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="48" font-weight="700">Make it fitted, not forced.</text>
    <text x="44" y="168" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20">Use Bricolage Grotesque for headlines</text>
    <text x="44" y="196" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20">and Instrument Sans for body copy.</text>
    <text x="44" y="222" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20" font-weight="700">Tone cues</text>
    <text x="44" y="258" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20">maker-led, exact, warm, useful, quietly confident</text>
    <text x="44" y="304" fill="#7B2FBE" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="20" font-weight="700">Avoid</text>
    <text x="122" y="300" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">community-circle tropes, tech-generic loops,</text>
    <text x="122" y="326" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="18">decorative fragments</text>
  </g>
</svg>