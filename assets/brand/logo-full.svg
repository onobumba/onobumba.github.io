<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hero" x1="170" y1="100" x2="1390" y2="812" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0E6FF"/>
    </linearGradient>
    <mask id="full-violet-interlock">
      <rect width="220" height="220" fill="black"/>
      <rect x="32" y="32" width="132" height="132" rx="40" fill="white"/>
      <rect x="82" y="82" width="48" height="48" rx="16" fill="black"/>
      <rect x="118" y="104" width="72" height="84" rx="28" fill="black"/>
    </mask>
    <mask id="full-lime-interlock">
      <rect width="220" height="220" fill="black"/>
      <rect x="88" y="88" width="100" height="100" rx="32" fill="white"/>
      <rect x="112" y="112" width="40" height="40" rx="14" fill="black"/>
      <rect x="70" y="70" width="56" height="56" rx="18" fill="black"/>
    </mask>
  </defs>
  <rect width="1600" height="900" fill="url(#hero)"/>
  <circle cx="1310" cy="154" r="172" fill="#D9B3FF" opacity="0.28"/>
  <circle cx="250" cy="748" r="210" fill="#D9B3FF" opacity="0.24"/>
  <circle cx="1340" cy="706" r="120" fill="#E8FF8A" opacity="0.24"/>
  <g transform="translate(150 220)">
    <rect width="220" height="220" fill="#7B2FBE" mask="url(#full-violet-interlock)"/>
    <rect width="220" height="220" fill="#C6F221" mask="url(#full-lime-interlock)"/>
  </g>
  <text x="470" y="362" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="172" font-weight="700" letter-spacing="-6">onobumba</text>
  <text x="470" y="442" fill="#7B2FBE" font-family="Bricolage Grotesque, Avenir Next, sans-serif" font-size="60" font-weight="600">Imagine. Build. Play.</text>
  <text x="470" y="508" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="30">Digital products made with the instinct of a craft studio</text>
  <text x="470" y="550" fill="#5A4D6B" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="30">and the discipline of parts that fit together cleanly.</text>

  <rect x="470" y="610" width="360" height="88" rx="44" fill="#7B2FBE"/>
  <rect x="854" y="610" width="292" height="88" rx="44" fill="#C6F221"/>
  <text x="650" y="666" text-anchor="middle" fill="#FFFFFF" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="28" font-weight="700">Product studio</text>
  <text x="1000" y="666" text-anchor="middle" fill="#1E1235" font-family="Instrument Sans, Avenir Next, sans-serif" font-size="28" font-weight="700">Built to fit</text>
</svg>