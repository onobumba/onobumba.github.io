# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Onobumba
email: info@onobumba.com
description: >-
  An independent product studio making useful software with imagination and play.
baseurl: ""
url: ""

# Company
company:
  tagline: "Imagine. Build. Play."
  mission: "Make Cool Things."

# Products
products:
  - name: "LandSteward"
    description: "Free eligibility checker and income calculator for English farmers. Check which SFI26 actions your farm qualifies for and estimate your annual income."
    status: "Live"
    url: "https://landsteward.co.uk"
    logo: "landsteward"
    tone: "field"
    features:
      - "SFI26 eligibility checking"
      - "Annual income estimation"
      - "Action comparison tools"
      - "Free to use"

  - name: "eKhaya"
    description: "All-in-one property management system for South African hotels and guesthouses. Simpler and more affordable than the alternatives."
    status: "Live"
    url: "https://ekhaya.app"
    logo: "ekhaya"
    tone: "clay"
    features:
      - "Guest & reservation management"
      - "Invoicing & payments"
      - "Housekeeping management"
      - "Multi-property support"

  - name: "Imvuzo"
    description: "Comprehensive payroll management software for South African businesses."
    status: "In Development"
    logo: "imvuzo"
    tone: "violet"
    features:
      - "Automated payroll processing"
      - "Tax compliance management"
      - "Employee self-service portal"
      - "Real-time reporting and analytics"

  - name: "Marabaraba"
    description: "A thoughtful digital edition of the classic strategy board game, designed for offline play without ads or subscriptions."
    status: "Live"
    url: "/marabaraba/support/"
    logo: "marabaraba"
    tone: "sun"
    features:
      - "Play entirely offline"
      - "One-time purchase"
      - "No ads or subscriptions"
      - "Simple, focused play"

# Build settings
theme: minima
plugins:
  - jekyll-seo-tag

# Sass configuration
sass:
  style: compressed
  sourcemap: development

# Build configuration
incremental: false
safe: false

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
